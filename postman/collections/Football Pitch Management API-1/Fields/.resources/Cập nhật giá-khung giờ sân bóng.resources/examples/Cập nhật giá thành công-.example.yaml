$kind: http-example
name: Cập nhật giá thành công.
request:
  url: "{{baseUrl}}/api/fields/price/:field_id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: field_id
      value: "1"
      disabled: false
      description: ID của sân bóng
  body:
    type: json
    content: |-
      {
        "StartTime": "06:00:00",
        "EndTime": "07:30:00",
        "Price": 300000
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Update price successfully"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "Update price successfully"
          }
        }
      }
order: 1000
