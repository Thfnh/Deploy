$kind: http-example
name: Danh sách lượt đặt sân.
request:
  url: "{{baseUrl}}/api/bookings/?status=CONFIRMED&date=2026-10-05"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: status
      value: CONFIRMED
      disabled: false
      description: Lọc theo trạng thái (PENDING, CONFIRMED, CANCELLED)
    - key: date
      value: 2026-10-05
      disabled: false
      description: Lọc theo ngày đặt (YYYY-MM-DD)
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "BookingID": 50,
          "UserID": 1,
          "FieldID": 1,
          "FieldName": "Sân 7 A1",
          "BookingDate": "2026-10-05",
          "StartTime": "06:00:00",
          "EndTime": "07:30:00",
          "Price": 300000,
          "Status": "CONFIRMED",
          "CreatedAt": "2026-10-01T08:30:00Z"
        },
        {
          "BookingID": 50,
